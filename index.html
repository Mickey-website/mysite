<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シンデレラ城から、夢の世界へ！</title>
  <style>
    body { margin: 0; padding: 24px; font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", Meiryo, sans-serif; line-height: 1.7; color: #3D4567; background: linear-gradient(180deg, #A9E3FF, #EAF9FF 45%, #FFF2D6); }
    .poster { max-width: 860px; margin: 0 auto; padding: 32px; overflow: hidden; border: 7px solid #FFF; border-radius: 30px; background: linear-gradient(145deg, #FFF, #FFF9EA); box-shadow: 0 12px 36px #4A629A30; }
    .hero { text-align: center; padding: 8px 0 12px; }
    .eyebrow { margin: 0; color: #527EAD; font-weight: bold; letter-spacing: 0.14em; }
    h1 { margin: 10px 0; color: #62478C; font-size: clamp(2.2rem, 7vw, 4.2rem); line-height: 1.25; text-shadow: 0 3px 0 #FFF; }
    h1 span { color: #E46F91; }
    .tagline { margin: 0; color: #785A8D; font-size: 1.15rem; font-weight: bold; }
    .updated { margin: 10px 0 0; color: #7D8295; font-size: 0.8rem; }
    .castle-figure { margin: 18px 0 12px; }
    .castle-figure img { display: block; width: 100%; height: auto; border: 7px solid #FFF; border-radius: 22px; box-shadow: 0 8px 24px #425A7A30; }
    .castle-figure figcaption { margin-top: 8px; color: #68718A; text-align: center; font-size: 0.78rem; }
    a { color: #526B9A; }
    .mascot-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px auto 20px; }
    .mascot-art { width: 82px; height: 82px; flex: 0 0 auto; }
    .mascot-message { margin: 0; color: #DE6685; font-size: 1.25rem; font-weight: bold; text-align: center; }
    h2 { margin: 20px 0 12px; color: #62478C; text-align: center; }
    .highlights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .highlight { padding: 16px 10px; border: 2px solid #FFF; border-radius: 16px; background: #EAF7FF; text-align: center; box-shadow: 0 4px 12px #4A629A16; }
    .highlight:nth-child(2) { background: #FFF0F4; }
    .highlight:nth-child(3) { background: #FFF6D9; }
    .highlight strong { display: block; color: #5B5D86; }
    .highlight-icon { display: block; margin-bottom: 4px; font-size: 1.8rem; }
    .sea-note { margin: 18px 0 0; padding: 14px; border-radius: 14px; background: #EEF2FF; text-align: center; }
    .sea-note strong { color: #526B9A; }
    .closing { margin: 18px 0 4px; color: #C65E7B; text-align: center; font-size: 1.15rem; font-weight: bold; }
    footer { margin-top: 18px; color: #7D8295; text-align: center; font-size: 0.76rem; }
    @media (max-width: 650px) {
      body { padding: 12px; }
      .poster { padding: 22px 16px; border-width: 4px; border-radius: 22px; }
      .castle-figure img { border-width: 4px; border-radius: 16px; }
      .mascot-art { width: 64px; height: 64px; }
      .highlights { grid-template-columns: 1fr; }
    }
    @media print {
      body { padding: 0; background: #FFF; }
      .poster { max-width: none; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <header class="hero">
      <p class="eyebrow">東京ディズニーランド</p>
      <h1>シンデレラ城から<br><span>夢の世界へ！</span></h1>
      <p class="tagline">ときめきとワクワクが待つ、特別な一日へ。</p>
      <p class="updated">最終更新：2026 年 11 月 18 日</p>
    </header>

    <figure class="castle-figure">
      <img src="images/disneyland-castle.jpg" alt="青空の下にそびえる東京ディズニーランドのシンデレラ城">
      <figcaption>写真：Øyvind Holmstad ／ <a href="https://commons.wikimedia.org/wiki/File:CASTLE_IN_TOKYO_DISNEYLAND.jpg">Wikimedia Commons 出典</a> ／ <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a></figcaption>
    </figure>

    <section class="mascot-row" aria-label="このポスターのオリジナル案内役">
      <svg class="mascot-art" viewBox="0 0 100 100" role="img" aria-label="にこにこ星のオリジナルイラスト">
        <path d="M50 5 62 35 94 37 70 57 78 90 50 73 22 90 30 57 6 37 38 35Z" fill="#FFD45D" stroke="#E8AE43" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="41" cy="48" r="3.5" fill="#614C62"/>
        <circle cx="59" cy="48" r="3.5" fill="#614C62"/>
        <path d="M42 59 Q50 68 58 59" fill="none" stroke="#614C62" stroke-width="3" stroke-linecap="round"/>
        <circle cx="34" cy="57" r="4" fill="#F39BA8"/>
        <circle cx="66" cy="57" r="4" fill="#F39BA8"/>
      </svg>
      <p class="mascot-message">キラキラの物語が<br>始まるよ！</p>
      <svg class="mascot-art" viewBox="0 0 100 100" role="img" aria-label="ほほえむ雲のオリジナルイラスト">
        <path d="M25 76C12 76 7 67 7 57c0-11 8-19 20-20 3-14 14-22 28-22 16 0 27 11 28 27 9 2 14 9 14 18 0 10-7 16-19 16Z" fill="#FFF" stroke="#81BEDB" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="40" cy="52" r="3.5" fill="#52627D"/>
        <circle cx="61" cy="52" r="3.5" fill="#52627D"/>
        <path d="M43 63 Q51 70 59 63" fill="none" stroke="#52627D" stroke-width="3" stroke-linecap="round"/>
        <circle cx="33" cy="61" r="4" fill="#F39BA8"/>
        <circle cx="68" cy="61" r="4" fill="#F39BA8"/>
      </svg>
    </section>

    <h2>お城を中心に楽しむ3つのこと</h2>
    <section class="highlights" aria-label="パークの楽しみ">
      <div class="highlight"><span class="highlight-icon" aria-hidden="true">📸</span><strong>お城の前で記念撮影</strong></div>
      <div class="highlight"><span class="highlight-icon" aria-hidden="true">🎠</span><strong>物語の世界をめぐる</strong></div>
      <div class="highlight"><span class="highlight-icon" aria-hidden="true">🎆</span><strong>パレードやショーを楽しむ</strong></div>
    </section>

    <p class="sea-note"><strong>冒険気分を味わうなら、東京ディズニーシーへ。</strong><br>火山や港町の景色が広がる、もうひとつの夢の世界も楽しめます。</p>
    <p class="closing">次のお休みは、夢の国へ出かけよう！</p>
    <footer>写真の作者・出典・ライセンスを記載しています。星と雲の案内役は、このページ用に作成したオリジナルイラストです。</footer>
  </main>
</body>
</html>
